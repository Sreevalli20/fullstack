services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weather-backend
    ports:
      - "3000:3000"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-weather-data-bucket}
      - OPEN_METEO_BASE_URL=${OPEN_METEO_BASE_URL:-https://archive-api.open-meteo.com/v1/archive}
      - RATE_LIMIT_STORE=${RATE_LIMIT_STORE:-10/minute}
      - RATE_LIMIT_LIST=${RATE_LIMIT_LIST:-60/minute}
      - RATE_LIMIT_CONTENT=${RATE_LIMIT_CONTENT:-60/minute}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: weather-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:3000}
    volumes:
      - ./src:/app/src
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
      - ./tsconfig.json:/app/tsconfig.json
    restart: unless-stopped
    depends_on:
      - backend
