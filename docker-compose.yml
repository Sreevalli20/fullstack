services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: weather-backend
    ports:
      - "8000:8000"
    environment:
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
      - GCS_BUCKET=${GCS_BUCKET:-weather-data-bucket}
      - LOCAL_STORAGE_DIR=${LOCAL_STORAGE_DIR:-data}
      - OPEN_METEO_BASE_URL=${OPEN_METEO_BASE_URL:-https://archive-api.open-meteo.com/v1/archive}
      - RATE_LIMIT_STORE=${RATE_LIMIT_STORE:-10/minute}
      - RATE_LIMIT_LIST=${RATE_LIMIT_LIST:-60/minute}
      - RATE_LIMIT_CONTENT=${RATE_LIMIT_CONTENT:-60/minute}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: weather-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
    restart: unless-stopped
    depends_on:
      - backend
