# Render deployment configuration
# https://render.com/docs/yaml-spec

services:
  - type: web
    name: weather-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    envVars:
      - key: STORAGE_TYPE
        value: local
      - key: LOCAL_STORAGE_PATH
        value: data
      - key: OPEN_METEO_BASE_URL
        value: https://archive-api.open-meteo.com/v1/archive
      - key: RATE_LIMIT_STORE
        value: 10/minute
      - key: RATE_LIMIT_LIST
        value: 60/minute
      - key: RATE_LIMIT_CONTENT
        value: 60/minute
      - key: LOG_LEVEL
        value: INFO
