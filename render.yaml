# Render deployment configuration
# https://render.com/docs/yaml-spec

services:
  - type: web
    name: weather-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: S3_BUCKET
        value: weather-data-bucket
      - key: OPEN_METEO_BASE_URL
        value: https://archive-api.open-meteo.com/v1/archive
      - key: RATE_LIMIT_STORE
        value: 10/minute
      - key: RATE_LIMIT_LIST
        value: 60/minute
      - key: RATE_LIMIT_CONTENT
        value: 60/minute
      - key: LOG_LEVEL
        value: INFO
